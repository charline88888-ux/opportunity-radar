name: Deploy GitHub Pages (on release tag)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen release
        run: |
          python scanner/validate.py
          python -m unittest discover -s scanner/tests
          test -f "releases/${GITHUB_REF_NAME}/dist/index.html" || (echo "缺少 releases/${GITHUB_REF_NAME}/dist/index.html" && exit 1)

      - name: Assemble Pages site from frozen releases
        run: |
          python scripts/build_site.py --releases releases --out _site --version "${GITHUB_REF_NAME}"
          cat _site/versions.json

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: 'deploy: ${{ github.ref_name }}'
          user_name: 'opportunity-radar-bot'
          user_email: 'bot@users.noreply.github.com'

      # 根目录必须是“当日 live 数据”；tag 部署只负责 /vX.Y.Z/ 归档与 versions。
      # 发布完成后触发一次 daily，避免 release 归档覆盖当天 live 根目录。
      - name: Refresh live root after release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run daily-update.yml --ref main
          echo "daily-update dispatched to restore live root"

